name: 🖥️ Windows Builds

on:
  push:
    branches-ignore:
      - "l10n_master"
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Game-INN-fork: enkel de CMake MSVC-build (pcsx2-qt.exe) die de kast-release gebruikt.
  # De andere varianten (SSE4/AVX2/Clang) staan uit om wachttijd en downloadfouten te beperken.
  # MSBUILD
  lint_vs_proj_files:
    name: Lint VS Project Files
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Verify VS Project Files
        run: .github\workflows\scripts\windows\validate-vs-filters.ps1

  build_qt_cmake:
    name: "CMake"
    if: github.repository != 'PCSX2/pcsx2' || github.event_name == 'pull_request'
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "CMake MSVC"
      artifactPrefixName: "PCSX2-windows-Qt-x64-cmake-msvc"
      configuration: CMake
      buildSystem: cmake
    secrets: inherit
